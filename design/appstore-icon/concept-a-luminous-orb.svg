<?xml version="1.0" encoding="UTF-8"?>
<!-- Concept A: Luminous Orb
     A glowing sphere centered on a deep-to-soft blue vertical gradient.
     The orb uses layered radial gradients to produce a convincing 3D glow,
     with a bloom halo and subtle inner highlight for depth.
     1024 x 1024, no transparency. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>

    <!-- Background: deep navy top → soft blue bottom -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a1628"/>
      <stop offset="50%"  stop-color="#103a6e"/>
      <stop offset="100%" stop-color="#1a6ea8"/>
    </linearGradient>

    <!-- Orb body: ivory-blue highlight → deep blue core, off-center for 3D lit-from-above feel -->
    <radialGradient id="orb-body" cx="42%" cy="35%" r="55%">
      <stop offset="0%"   stop-color="#e8f6ff" stop-opacity="1"/>
      <stop offset="20%"  stop-color="#b8deff" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#4fa3e8" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#1a5da8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d3268" stop-opacity="1"/>
    </radialGradient>

    <!-- Orb outer glow: soft blue halo that bleeds into the background -->
    <radialGradient id="orb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6bbfff" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#3a8fd4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a5faa" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner specular bloom (small bright spot for glass/wet look) -->
    <radialGradient id="orb-spec" cx="36%" cy="28%" r="30%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%"  stop-color="#d0eeff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle vignette overlay to ground the orb -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32"/>
    </radialGradient>

    <!-- Bloom filter: soft gaussian blur -->
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Orb drop shadow / atmosphere -->
    <filter id="orb-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="shadow"/>
      <feOffset dx="0" dy="20" result="offsetShadow"/>
      <feMerge>
        <feMergeNode in="offsetShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ── Background ── -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- ── Halo bloom (large, blurred glow ring behind orb) ── -->
  <circle cx="512" cy="498" r="290" fill="url(#orb-glow)" filter="url(#bloom)"/>

  <!-- ── Outer atmospheric glow layer ── -->
  <circle cx="512" cy="498" r="240" fill="none"
          stroke="#5ab2f0" stroke-width="2" stroke-opacity="0.18" filter="url(#bloom)"/>

  <!-- ── Orb body ── -->
  <g filter="url(#orb-shadow)">
    <circle cx="512" cy="498" r="220" fill="url(#orb-body)"/>
  </g>

  <!-- ── Specular highlight (glass/wet look) ── -->
  <ellipse cx="460" cy="415" rx="95" ry="80" fill="url(#orb-spec)"/>

  <!-- ── Vignette on canvas edges ── -->
  <rect width="1024" height="1024" fill="url(#vignette)"/>

</svg>
