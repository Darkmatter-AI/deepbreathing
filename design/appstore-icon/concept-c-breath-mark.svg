<?xml version="1.0" encoding="UTF-8"?>
<!-- Concept C: Minimal Breath Mark
     An abstract "breath" form: two soft opposing arcs (like cupped hands /
     a stylised pair of lungs or an inhale/exhale wave) rendered as thick,
     rounded strokes in soft blue on a warm rounded-square gradient field.
     The mark is large, bold, and resolves clearly at 60px.
     Background: gentle peach-to-blue gradient (warmer than A/B, friendlier).
     1024 x 1024, no transparency. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>

    <!-- Background: warm dusty rose top → soft sky blue bottom -->
    <linearGradient id="bg-c" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#c9d8f5"/>
      <stop offset="40%"  stop-color="#a8c8f0"/>
      <stop offset="100%" stop-color="#6ea8e0"/>
    </linearGradient>

    <!-- Breath mark stroke gradient: white-blue, gives luminous ink feel -->
    <linearGradient id="stroke-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#cce8ff" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#5a9fe0" stop-opacity="0.80"/>
    </linearGradient>

    <!-- Soft inner glow/halo on the mark -->
    <filter id="mark-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle drop shadow for depth -->
    <filter id="mark-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="24"
                    flood-color="#1a5499" flood-opacity="0.28"/>
    </filter>

    <!-- Background panel: slightly rounded, ivory overlay for gentle vignette depth -->
    <radialGradient id="bg-panel" cx="50%" cy="45%" r="65%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vig-c" cx="50%" cy="50%" r="72%">
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.20"/>
    </radialGradient>

  </defs>

  <!-- ── Background ── -->
  <rect width="1024" height="1024" fill="url(#bg-c)"/>

  <!-- ── Subtle radial lightening in center ── -->
  <rect width="1024" height="1024" fill="url(#bg-panel)"/>

  <!-- ── The breath mark ──
       Two mirrored arcs: upper arc curves upward (inhale), lower curves down (exhale).
       Together they read as a breathing wave, a leaf form, or a stylised lung pair.
       Drawn as thick rounded-cap strokes with a luminous gradient fill so they
       look like illuminated tubes rather than flat lines.
  -->

  <!-- Upper arc: sweeps from left-center up and over to right-center -->
  <g filter="url(#mark-shadow)">
    <!-- Upper arc — curves upward, like a rising breath -->
    <path d="M 248 528
             C 248 288, 776 288, 776 528"
          fill="none"
          stroke="url(#stroke-grad)"
          stroke-width="62"
          stroke-linecap="round"
          filter="url(#mark-glow)"/>

    <!-- Lower arc — curves downward, mirror image for exhale -->
    <path d="M 248 528
             C 248 768, 776 768, 776 528"
          fill="none"
          stroke="url(#stroke-grad)"
          stroke-width="62"
          stroke-linecap="round"
          filter="url(#mark-glow)"/>
  </g>

  <!-- ── Small center accent dot (the still-point between inhale and exhale) ── -->
  <circle cx="512" cy="528" r="22" fill="#ffffff" fill-opacity="0.85" filter="url(#mark-glow)"/>

  <!-- ── Vignette ── -->
  <rect width="1024" height="1024" fill="url(#vig-c)"/>

</svg>
